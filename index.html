var LES={frac:[['What is a fraction?',['A fraction shows part of a whole. In 3/4, the bottom number (denominator) tells how many equal parts the whole is cut into, and the top number (numerator) tells how many of those parts we take.','Example: a roti is cut into 4 equal parts and you eat 3. You ate 3/4 of the roti.'],['Shade 2/5 of a chocolate bar','Break the bar into 5 equal pieces.','Colour 2 of the pieces.','2 out of 5 equal parts are shaded, so that is 2/5.'],['In 5/8, what does the 8 tell us?','Parts we take','Total equal parts in the whole','Size of each part',1,'The denominator is the total number of equal parts in the whole.']],
['Proper, improper and mixed fractions',['In a proper fraction the numerator is smaller than the denominator (3/7). In an improper fraction it is equal or larger (9/5). A mixed number has a whole part and a fraction part (1 4/5).','To change improper to mixed, divide the numerator by the denominator: the quotient is the whole part and the remainder goes over the same denominator.'],['Convert 11/4 to a mixed number','Divide 11 by 4: quotient 2, remainder 3.','The whole part is 2 and the fraction part is 3/4.','So 11/4 = 2 3/4.'],['Which is an improper fraction?','3/7','9/5','1/2',1,'9/5 has a numerator larger than its denominator.']],
['Equivalent fractions and simplest form',['Fractions that show the same amount are equivalent. Multiply or divide the numerator and denominator by the same number: 1/2 = 2/4 = 3/6.','A fraction is in simplest form when the numerator and denominator share no common factor except 1. Divide both by their HCF to get there.'],['Simplify 12/18','The HCF of 12 and 18 is 6.','12 ÷ 6 = 2 and 18 ÷ 6 = 3.','So 12/18 = 2/3.'],['Which fraction equals 2/3?','4/6','3/2','2/6',0,'Multiply top and bottom of 2/3 by 2 to get 4/6.']],
['Comparing fractions',['Same denominator: the larger numerator is the larger fraction (5/9 > 4/9). Same numerator: the larger denominator is the smaller fraction (1/3 > 1/5), because the whole is cut into more pieces.','Different denominators: make them equal using the LCM, then compare numerators. Remember: a bigger denominator does not mean a bigger fraction.'],['Compare 2/3 and 3/5','LCM of 3 and 5 is 15.','2/3 = 10/15 and 3/5 = 9/15.','10/15 is more than 9/15, so 2/3 is larger.'],['Which is larger, 1/3 or 1/5?','1/3','1/5','They are equal',0,'Thirds are bigger pieces than fifths.']],
['Adding and subtracting fractions',['With the same denominator, add or subtract the numerators and keep the denominator: 2/7 + 3/7 = 5/7. Never add the denominators.','With different denominators, first convert both to the LCM as the common denominator, then add or subtract.'],['Add 1/2 + 1/3','LCM of 2 and 3 is 6.','1/2 = 3/6 and 1/3 = 2/6.','3/6 + 2/6 = 5/6.'],['2/7 + 3/7 = ?','5/14','5/7','6/7',1,'Keep the denominator 7 and add the numerators: 2 + 3 = 5.']],
['Multiplying fractions',['Multiply the numerators together and the denominators together. The word “of” means multiply: 1/2 of 10 is 1/2 × 10 = 5.'],['Multiply 2/3 × 3/4','Top × top: 2 × 3 = 6.','Bottom × bottom: 3 × 4 = 12.','6/12 simplifies to 1/2.'],['1/2 × 6 = ?','3','12','1/12',0,'Half of 6 is 3.']],
['Dividing fractions',['To divide by a fraction, multiply by its reciprocal (flip it upside down). The reciprocal of 1/2 is 2/1.','Why? Dividing 1 by 1/2 asks how many halves fit in 1, and the answer is 2.'],['Divide 3/4 ÷ 1/2','Flip 1/2 to get 2/1.','Multiply: 3/4 × 2 = 6/4.','Simplify: 6/4 = 3/2 = 1 1/2.'],['1/2 ÷ 1/4 = ?','1/8','2','1/2',1,'Two quarters fit in a half: 1/2 × 4 = 2.']]],
neg:[['Numbers on the number line',['Negative numbers lie to the left of zero. The further left, the smaller the number, so −7 < −3 < 0 < 2. Think of temperatures below zero or a bank balance in debt.'],['Order −2, 5, −6, 0','Place them on the number line.','Left to right: −6, −2, 0, 5.','The smallest is −6 and the largest is 5.'],['Which is greater: −7 or −3?','−7','−3','They are equal',1,'−3 is closer to zero, so it is further right and greater.']],
['Adding integers',['Same signs: add the sizes and keep the sign. (−3) + (−4) = −7.','Different signs: subtract the smaller size from the larger and keep the sign of the larger. −5 + 8 = +3.'],['Add −5 + 8','Signs are different, so subtract sizes: 8 − 5 = 3.','8 is larger and positive, so the answer is positive.','−5 + 8 = 3.'],['−4 + 9 = ?','−5','5','13',1,'Different signs: 9 − 4 = 5, positive because 9 is larger.']],
['Subtracting integers',['Subtracting a number is the same as adding its opposite: a − b = a + (−b). So 5 − (−2) = 5 + 2 = 7.','On the number line, subtracting a positive moves left; subtracting a negative moves right.'],['Calculate −3 − 4','Start at −3 on the number line.','Subtracting 4 moves 4 steps left.','−3 − 4 = −7.'],['5 − (−3) = ?','2','8','−8',1,'Subtracting −3 is adding 3: 5 + 3 = 8.']],
['Multiplying and dividing integers',['Same signs give a positive answer; different signs give a negative answer. This works for both multiplication and division.','(−) × (−) = +, (+) × (−) = −, (−) ÷ (−) = +, (−) ÷ (+) = −.'],['Calculate (−2) × (−5) and (−12) ÷ 3','(−2) × (−5): same signs, so positive: 10.','(−12) ÷ 3: different signs, so negative: −4.','Answers: 10 and −4.'],['(−3) × 4 = ?','12','−12','−1',1,'Different signs give a negative answer: −12.']],
['Negative numbers in real life',['Negative numbers describe temperatures below zero, depths below sea level and money owed. Turn the story into an integer sum, then solve it.'],['Temperature is −3°C and rises by 7°C','Write it as −3 + 7.','Different signs: 7 − 3 = 4.','The new temperature is 4°C.'],['−2°C falls by 5°C. New temperature?','3°C','−7°C','−3°C',1,'Falling means subtracting: −2 − 5 = −7.']]],
lin:[['What is an equation?',['An equation says two expressions are equal, like a balanced scale: x + 3 = 7. Solving means finding the value of x that keeps the scale balanced.','Anything you do to one side, you must do to the other.'],['Is x = 4 a solution of x + 3 = 7?','Put x = 4 on the left: 4 + 3 = 7.','The right side is 7 too.','Both sides match, so x = 4 is the solution.'],['Is x = 5 a solution of x + 3 = 7?','Yes','No','Cannot say',1,'5 + 3 = 8, which is not 7, so it is not a solution.']],
['One-step equations',['Undo the operation using its opposite: add to undo subtract, subtract to undo add, divide to undo multiply. Do it on both sides.','Moving a term across the equals sign changes its sign.'],['Solve x + 5 = 2','Subtract 5 from both sides: x = 2 − 5.','x = −3.','Check: −3 + 5 = 2.'],['x − 6 = 4. Find x.','−2','10','24',1,'Add 6 to both sides: x = 4 + 6 = 10.']],
['Two-step equations',['First remove the added or subtracted number, then divide by the number multiplying x. Do the addition or subtraction first.'],['Solve 3x − 4 = 5','Add 4 to both sides: 3x = 9.','Divide both sides by 3: x = 3.','Check: 3 × 3 − 4 = 5.'],['2x + 3 = 11. Find x.','7','4','14',1,'Subtract 3: 2x = 8, then divide by 2: x = 4.']],
['Variables on both sides',['Collect all x terms on one side and plain numbers on the other, changing the sign of any term you move. Then solve as a two-step equation.'],['Solve 5x − 2 = 3x + 6','Move 3x to the left: 5x − 3x − 2 = 6.','Move −2 to the right: 2x = 8.','Divide by 2: x = 4.'],['4x = 2x + 10. Find x.','5','10','2.5',0,'Subtract 2x: 2x = 10, so x = 5.']],

quad:[['What is a quadratic equation?',['A quadratic equation has the form ax² + bx + c = 0, where the highest power of x is 2. It can have up to two solutions.','Linear equations have one answer; quadratics often have two, because both a number and its negative can square to the same value.'],['Is x² − 4 = 0 quadratic?','The highest power of x is 2.','It matches ax² + bx + c = 0 with a = 1, b = 0, c = −4.','Yes, it is quadratic.'],['Which equation is quadratic?','3x + 2 = 0','x² − 4 = 0','x³ = 8',1,'Only x² − 4 = 0 has x² as its highest power.']],
['Solving x² = k by square roots',['If x² = k, then x = +√k or −√k, because (−4)² is also 16. Writing x = ±4 shows both answers.'],['Solve x² = 16','Take the square root of both sides.','x = +4 or x = −4.','Check: 4² = 16 and (−4)² = 16.'],['x² = 25. Find x.','5','±5','12.5',1,'Both 5 and −5 square to 25.']],
['Factorised form',['If two things multiply to zero, at least one of them is zero. So (x − a)(x − b) = 0 gives x = a or x = b. Watch the signs: the bracket (x − 2) gives x = +2.'],['Solve (x − 2)(x + 3) = 0','x − 2 = 0 gives x = 2.','x + 3 = 0 gives x = −3.','Answer: x = 2 or x = −3.'],['(x + 1)(x − 4) = 0. Find x.','1 or −4','−1 or 4','−1 or −4',1,'x + 1 = 0 gives −1, and x − 4 = 0 gives 4.']],
['Solving by factorising',['To solve x² + bx + c = 0, find two numbers whose product is c and whose sum is b. Write the brackets, then use the zero-product idea.'],['Solve x² + 5x + 6 = 0','Find two numbers with product 6 and sum 5: 2 and 3.','Factorise: (x + 2)(x + 3) = 0.','x = −2 or x = −3.'],['x² − 5x + 6 = 0. Find x.','2 or 3','−2 or −3','1 or 6',0,'Numbers with product 6 and sum −5 are −2 and −3, so x = 2 or 3.']]]};

var FIX={bigDen:["You compared the bottom numbers. A bigger denominator means the whole is cut into more pieces, so each piece is smaller.","Compare pieces of the same whole: 1/2 is half a pizza, 1/5 is one slice out of five. Make the denominators equal, or picture the pieces."],

var SOL={1:"Thirds are smaller pieces than halves, so 1/2 is larger. Check: 1/2 = 3/6 and 1/3 = 2/6, and 3/6 is more than 2/6.",2:"The denominators match, so add the tops and keep the bottom: 2 + 1 = 3 out of 5, which is 3/5.",3:"Start at −3 and go 4 steps left: −4, −5, −6, −7. So −3 − 4 = −7.",4:"Same signs multiply to a positive: 2 × 5 = 10, so (−2) × (−5) = 10.",5:"Subtract 5 from both sides: x = 2 − 5 = −3. Check: −3 + 5 = 2.",6:"Add 4 to both sides: 3x = 9. Divide by 3: x = 3. Check: 3 × 3 − 4 = 5.",7:"x − 2 = 0 gives x = 2, and x + 3 = 0 gives x = −3.",8:"Take the square root of both sides: x = ±4, because 4² = 16 and (−4)² = 16.",9:"x² = 9, so x = ±3, because 3² = 9 and (−3)² = 9.",10:"Make the denominators equal: 2/3 = 10/15 and 3/5 = 9/15. 10/15 is bigger, so 2/3 is larger.",11:"The LCM of 2 and 3 is 6: 1/2 = 3/6 and 1/3 = 2/6, so the sum is 5/6.",12:"The denominators match, so subtract the tops: 3 − 1 = 2, giving 2/5.",13:"0.5 means 5 tenths, which is 5/10. Divide top and bottom by 5 to get 1/2.",14:"The signs differ, so subtract the sizes: 8 − 5 = 3. The 8 is larger and positive, so −5 + 8 = 3.",15:"Start at 7 and go 10 steps left to land on −3.",16:"Different signs divide to a negative: 6 ÷ 2 = 3, so (−6) ÷ 2 = −3.",17:"Same signs multiply to a positive: 3 × 3 = 9.",18:"Add 7 to both sides: x = 3 + 7 = 10.",19:"Divide both sides by 2: x = 14 ÷ 2 = 7.",20:"Subtract 3 from both sides: 2x = 8. Divide by 2: x = 4.",21:"Move 3x to the left: 2x − 2 = 6, so 2x = 8 and x = 4.",22:"x² = 25, so x = ±5.",23:"x + 1 = 0 gives x = −1, and x − 4 = 0 gives x = 4.",24:"x² = 49, so x = ±7.",25:"Either x = 0 or x + 5 = 0, so x = 0 or x = −5."};
