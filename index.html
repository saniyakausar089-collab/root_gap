<html lang="en"><head><meta charset="utf-8">

<style>
:root {
  --bg: #07060d;
  --bg-gradient: radial-gradient(circle at 50% 0%, #1e123a 0%, #0c0a18 50%, #07060d 100%);
  --card: rgba(18, 15, 34, 0.78);
  --card-solid: #120f24;
  --card-border: rgba(139, 92, 246, 0.22);
  --tx: #f8fafc;
  --mut: #94a3b8;
  --pri: #8b5cf6;
  --pri-glow: rgba(139, 92, 246, 0.45);
  --pri-soft: rgba(139, 92, 246, 0.16);
  --sec: #ec4899;
  --sec-glow: rgba(236, 72, 153, 0.4);
  --uv: #6366f1;
  --amber: #f59e0b;
  --ln: rgba(139, 92, 246, 0.22);
  --ok: #10b981;
  --ok-soft: rgba(16, 185, 129, 0.16);
  --bad: #f43f5e;
  --bad-soft: rgba(244, 63, 94, 0.16);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.16);
  --soft: rgba(30, 24, 56, 0.65);
  --gold: #fbbf24;
  --purple: #a855f7;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07060d;
    --card: rgba(18, 15, 34, 0.78);
    --tx: #f8fafc;
    --mut: #94a3b8;
    --pri: #8b5cf6;
    --pri-soft: rgba(139, 92, 246, 0.16);
    --ln: rgba(139, 92, 246, 0.22);
    --ok: #10b981;
    --ok-soft: rgba(16, 185, 129, 0.16);
    --bad: #f43f5e;
    --bad-soft: rgba(244, 63, 94, 0.16);
    --warn: #f59e0b;
    --warn-soft: rgba(245, 158, 11, 0.16);
    --soft: rgba(30, 24, 56, 0.65);
    --gold: #fbbf24;
    --purple: #a855f7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07060d;
  --card: rgba(18, 15, 34, 0.78);
  --tx: #f8fafc;
  --mut: #94a3b8;
  --pri: #8b5cf6;
  --pri-soft: rgba(139, 92, 246, 0.16);
  --ln: rgba(139, 92, 246, 0.22);
  --ok: #10b981;
  --ok-soft: rgba(16, 185, 129, 0.16);
  --bad: #f43f5e;
  --bad-soft: rgba(244, 63, 94, 0.16);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.16);
  --soft: rgba(30, 24, 56, 0.65);
  --gold: #fbbf24;
  --purple: #a855f7;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: 
    radial-gradient(ellipse 90% 55% at 50% -20%, rgba(124, 58, 237, 0.28), transparent 70%),
    radial-gradient(ellipse 70% 45% at 85% 65%, rgba(236, 72, 153, 0.14), transparent 60%),
    radial-gradient(ellipse 60% 40% at 15% 85%, rgba(99, 102, 241, 0.12), transparent 55%),
    #07060d;
  background-attachment: fixed;
  color: var(--tx);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Noto Sans Telugu", sans-serif;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 960px; margin: 0 auto; padding: 16px 14px 60px; transition: max-width .3s ease; }
body.is-landing main { max-width: 1240px; padding: 0 16px 80px; }

header {
  position: sticky;
  top: 0;
  z-index: 80;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  max-width: 960px;
  margin: 0 auto;
  background: rgba(8, 7, 13, 0.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--ln);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  transition: max-width .3s ease;
}
body.is-landing header { max-width: 1240px; }
header b { font-size: 21px; font-weight: 800; letter-spacing: -0.03em; }
header span { color: var(--mut); font-size: 12px; display: block; }
.brand-btn { cursor: pointer; transition: transform .2s ease; }
.brand-btn:hover { transform: translateY(-1px); }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, select, input, textarea { font: inherit; color: var(--tx); }
.btn, .chip, .opt, .tab, .cf {
  background: var(--card);
  border: 1px solid var(--ln);
  border-radius: 12px;
  padding: 8px 14px;
  cursor: pointer;
  transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
  color: var(--tx);
}
.btn:hover, .chip:hover, .tab:hover {
  border-color: var(--pri);
  background: rgba(139, 92, 246, 0.15);
  box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
  transform: translateY(-1px);
}
.btn.p, .tab.on {
  background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%) !important;
  color: #fff !important;
  border-color: transparent !important;
  box-shadow: 0 0 20px rgba(124, 58, 237, 0.45);
  font-weight: 600;
}
.btn.p:hover {
  box-shadow: 0 0 30px rgba(236, 72, 153, 0.6);
  transform: translateY(-2px);
}
html[data-theme="dark"] .btn.p, html[data-theme="dark"] .tab.on { color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn.gold {
  background: linear-gradient(135deg, #f59e0b, #fbbf24);
  color: #07060d;
  border-color: transparent;
  font-weight: 700;
  box-shadow: 0 0 15px rgba(245, 158, 11, 0.35);
}
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 18px;
  margin: 14px 0;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.card:hover {
  border-color: rgba(139, 92, 246, 0.4);
  box-shadow: 0 12px 40px -4px rgba(0, 0, 0, 0.5), 0 0 20px -2px rgba(139, 92, 246, 0.2);
}
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.chip { text-align: left; }
.chip small { display: block; color: var(--mut); }
.opt { display: block; width: 100%; text-align: left; margin: 8px 0; font-size: 16px; border-radius: 12px; }
.opt.sel { border-color: var(--pri); background: var(--soft); box-shadow: 0 0 12px var(--pri-glow); }
.opt.good { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 0 15px rgba(244, 63, 94, 0.3); }
.cf { flex: 1; text-align: center; font-size: 15px; min-width: 90px; }
.cf span { font-size: 24px; display: block; }
.tag { font-size: 11px; font-weight: 700; color: #c084fc; text-transform: uppercase; letter-spacing: .06em; }
.mut { color: var(--mut); }
.lesson {
  background: rgba(30, 24, 56, 0.7);
  border-left: 4px solid var(--amber);
  padding: 12px 16px;
  border-radius: 10px;
  margin: 12px 0;
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-left-width: 4px;
}
.bar { height: 8px; border-radius: 6px; background: rgba(139, 92, 246, 0.2); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #7c3aed, #ec4899); transition: width .3s ease; }
.m4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.pill { display: inline-block; border-radius: 20px; padding: 3px 12px; font-size: 12px; border: 1px solid var(--ln); font-weight: 600; }
.pill.c { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.pill.l { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.pill.g { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.stat { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { border-bottom: 1px solid var(--ln); padding: 8px 6px; text-align: left; vertical-align: top; }
.tbl { overflow-x: auto; }
select { background: #120f24; border: 1px solid var(--ln); border-radius: 10px; padding: 7px 10px; color: #fff; }
h2, h3, h4 { margin: 8px 0; color: #fff; }
.hero {
  display: flex; gap: 14px; align-items: center;
  background: linear-gradient(135deg, rgba(35, 23, 69, 0.95) 0%, rgba(76, 29, 149, 0.8) 50%, rgba(236, 72, 153, 0.35) 100%);
  border: 1px solid rgba(139, 92, 246, 0.35);
  box-shadow: 0 12px 40px rgba(124, 58, 237, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(14px);
  color: #fff; border-radius: 20px; padding: 18px; margin: 12px 0;
}
.hero .mut, .hero small { color: #e2e8f0; }
.hero .bar { background: rgba(255, 255, 255, 0.2); }
.hero .bar i { background: #fff !important; }
.av {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(139, 92, 246, 0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex: 0 0 auto;
}
.av.big { width: 60px; height: 60px; font-size: 36px; }
.ring {
  width: 66px; height: 66px; border-radius: 50%;
  background: conic-gradient(#ec4899 calc(var(--p)*1%), rgba(255, 255, 255, 0.15) 0);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; flex: 0 0 auto;
}
.ring::before { content: ""; position: absolute; inset: 6px; background: #120f24; border-radius: 50%; }
.ring b, .ring small { position: relative; font-size: 12px; line-height: 1.1; color: #fff; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 12px 0; }
.tile {
  background: var(--card); border: 1px solid var(--ln); border-radius: 18px;
  padding: 16px; text-align: left; cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
}
.tile:hover { transform: translateY(-2px); border-color: var(--pri); box-shadow: 0 8px 24px var(--pri-glow); }
.tile:active { transform: scale(.97); }
.tile b { display: block; font-size: 15px; margin-top: 6px; }
.tile .e { font-size: 30px; display: block; }
.tile small { color: var(--mut); font-size: 12px; }
.badge { display: flex; flex-direction: column; align-items: center; width: 86px; font-size: 28px; text-align: center; }
.badge small { font-size: 11px; line-height: 1.2; }
.badge.off { filter: grayscale(1); opacity: .3; }

.snav {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-around;
  background: rgba(8, 7, 13, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--ln);
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 60;
  box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
}
.snav button {
  border: 0; background: none; font-size: 11px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 12px; cursor: pointer; color: var(--mut); transition: all .2s ease;
  border-radius: 10px;
}
.snav button:hover { color: #fff; background: rgba(139, 92, 246, 0.12); }
.snav button span { font-size: 20px; }
.snav button.on {
  color: #fff; font-weight: 700;
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.4), rgba(236, 72, 153, 0.3));
  border: 1px solid rgba(139, 92, 246, 0.4);
}
.spacer { height: 84px; }
.chip.sel { border-color: var(--pri); background: var(--soft); box-shadow: 0 0 12px var(--pri-glow); }
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: #fff; padding: 10px 22px; border-radius: 30px;
  z-index: 120; animation: tt 1.8s forwards; font-weight: 600;
  box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5); border: 1px solid rgba(255, 255, 255, 0.2);
}
@keyframes tt { 0% { opacity: 0; transform: translate(-50%, 10px); } 15%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.cf2 { position: fixed; top: -30px; font-size: 24px; z-index: 98; pointer-events: none; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(360deg); opacity: .2; } }
#app > * { animation: up .25s both; }
@keyframes up { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { #app > *, .cf2, .toast { animation: none !important; } }

/* Concept Map Nodes */
.cmap { display: flex; flex-direction: column; gap: 16px; padding: 10px 0; position: relative; }
.cnode {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px;
  border-radius: 14px; border: 2px solid var(--ln);
  background: var(--card); cursor: pointer; position: relative;
  transition: all .2s ease;
}
.cnode:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--pri-glow); }
.cnode.mast { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
.cnode.dev { border-color: var(--pri); background: var(--pri-soft); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }
.cnode.weak { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 0 15px rgba(244, 63, 94, 0.2); }
.cnode.lock { opacity: .5; background: rgba(30, 24, 56, 0.4); }
.cnode-icon { font-size: 26px; width: 42px; height: 42px; border-radius: 50%; background: #120f24; border: 1px solid var(--ln); display: flex; align-items: center; justify-content: center; }

/* Chat & Tutor Drawer */
.drawer { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 100; display: flex; justify-content: flex-end; }
.drawer-body {
  width: 100%; max-width: 460px;
  background: rgba(12, 10, 24, 0.96);
  border-left: 1px solid var(--ln);
  height: 100%; display: flex; flex-direction: column; padding: 18px;
  box-shadow: -8px 0 40px rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(20px);
}
.chat-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 12px 0; }
.msg { padding: 12px 16px; border-radius: 16px; max-width: 85%; font-size: 14.5px; line-height: 1.5; }
.msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: #fff; border-bottom-right-radius: 4px;
  box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
}
.msg.bot {
  align-self: flex-start;
  background: rgba(24, 19, 44, 0.85);
  border: 1px solid var(--ln);
  border-bottom-left-radius: 4px;
  color: #f1f5f9;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
}

/* Floating Action Button (FAB) for AI Rooty */
.fab-rooty {
  position: fixed;
  right: 22px;
  bottom: 86px;
  z-index: 70;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(124, 58, 237, 0.6), 0 6px 20px rgba(0, 0, 0, 0.5);
  border: 2px solid rgba(255, 255, 255, 0.3);
  transition: all .25s cubic-bezier(0.4, 0, 0.2, 1);
}
.fab-rooty:hover {
  transform: scale(1.1) translateY(-3px);
  box-shadow: 0 0 35px rgba(236, 72, 153, 0.8), 0 8px 25px rgba(0, 0, 0, 0.6);
}
.fab-rooty svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2; }
.fab-rooty-pulse {
  position: absolute; inset: -4px; border-radius: 50%;
  border: 2px solid rgba(236, 72, 153, 0.6);
  animation: fabPulse 2.5s infinite;
  pointer-events: none;
}
@keyframes fabPulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }

/* Matrix / Heatmap */
.heatmap-cell { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #fff; }
.hm-1 { background: #f43f5e; box-shadow: 0 0 8px rgba(244, 63, 94, 0.4); }
.hm-2 { background: #f59e0b; color: #07060d; box-shadow: 0 0 8px rgba(245, 158, 11, 0.3); }
.hm-3 { background: #10b981; color: #07060d; box-shadow: 0 0 8px rgba(16, 185, 129, 0.3); }
.hm-4 { background: #059669; box-shadow: 0 0 8px rgba(5, 150, 105, 0.4); }

/* ========================================================
   CINEMATIC 3D LANDING PAGE STYLES
   ======================================================== */
.rg-landing-wrap {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 80px;
  padding: 20px 0 60px;
}
.rg-gradient-text {
  background: linear-gradient(135deg, #c084fc 0%, #f472b6 50%, #fb7185 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

/* SECTION 1: HERO */
.rg-landing-hero {
  position: relative;
  min-height: 85vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  border-radius: 28px;
  background: radial-gradient(circle at 50% 30%, rgba(35, 23, 69, 0.6) 0%, rgba(12, 10, 24, 0.85) 65%, #07060d 100%);
  border: 1px solid rgba(139, 92, 246, 0.25);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  padding: 40px 24px;
}
.rg-canvas-wrap {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}
#rg-hero-canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.rg-hero-glow-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 40%, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
  pointer-events: none;
}
.rg-hero-content {
  position: relative;
  z-index: 2;
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.rg-badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border-radius: 30px;
  background: rgba(139, 92, 246, 0.15);
  border: 1px solid rgba(139, 92, 246, 0.35);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #d8b4fe;
  text-transform: uppercase;
  box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
}
.rg-badge-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ec4899;
  box-shadow: 0 0 8px #ec4899;
  animation: dotPulse 2s infinite;
}
@keyframes dotPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

.rg-hero-title {
  font-size: clamp(38px, 6vw, 68px);
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: -0.04em;
  margin: 0;
  color: #fff;
  text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}
.rg-hero-sub {
  font-size: clamp(16px, 2.2vw, 21px);
  line-height: 1.5;
  color: #cbd5e1;
  max-width: 680px;
  margin: 0;
  font-weight: 400;
}
.rg-hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  margin-top: 10px;
}
.btn-luxury {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 28px;
  border-radius: 14px;
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: all .25s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
  border: 1px solid transparent;
}
.btn-luxury.primary {
  background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
  color: #fff;
  box-shadow: 0 0 25px rgba(124, 58, 237, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
}
.btn-luxury.primary:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 0 35px rgba(236, 72, 153, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.btn-luxury.secondary {
  background: rgba(22, 18, 42, 0.8);
  color: #e2e8f0;
  border-color: rgba(139, 92, 246, 0.35);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

// Dynamic loader for comprehensive Practice Question Bank across Classes 6-10
function loadPracticeBankIntoQS(){
  if(typeof PRACTICE_BANK==="undefined")return;
  var nextId=101;
  var skillMap={6:"frac",7:"neg",8:"lin",9:"quad",10:"quad"};
  for(var cls in PRACTICE_BANK){
    var list=PRACTICE_BANK[cls];
    var sk=skillMap[cls]||"frac";
    list.forEach(function(item){
      if(QS.some(function(q){return q.codeId===item.id;}))return;
      var qId=nextId++;
      var opts=item.options.map(function(opt,idx){
        if(idx===item.ans)return [opt];
        return [opt,item.misconception?"conceptGap":"guess"];
      });
      var qObj={
        id:qId,
        codeId:item.id,
        s:sk,
        cls:parseInt(cls),
        topic:item.topic,
        chapter:item.chapter,
        t:[item.q,item.q,item.q],
        o:opts,
        a:item.ans,
        d:item.difficulty||2,
        hint:item.hint,
        exp:item.exp,
        format:item.format||"mcq"
      };
      QS.push(qObj);
      if(item.exp&&typeof SOL!=="undefined")SOL[qId]=item.exp;
    });
  }
}
loadPracticeBankIntoQS();

var LES={frac:[['What is a fraction?',['A fraction shows part of a whole. In 3/4, the bottom number (denominator) tells how many equal parts the whole is cut into, and the top number (numerator) tells how many of those parts we take.','Example: a roti is cut into 4 equal parts and you eat 3. You ate 3/4 of the roti.'],['Shade 2/5 of a chocolate bar','Break the bar into 5 equal pieces.','Colour 2 of the pieces.','2 out of 5 equal parts are shaded, so that is 2/5.'],['In 5/8, what does the 8 tell us?','Parts we take','Total equal parts in the whole','Size of each part',1,'The denominator is the total number of equal parts in the whole.']],
['Proper, improper and mixed fractions',['In a proper fraction the numerator is smaller than the denominator (3/7). In an improper fraction it is equal or larger (9/5). A mixed number has a whole part and a fraction part (1 4/5).','To change improper to mixed, divide the numerator by the denominator: the quotient is the whole part and the remainder goes over the same denominator.'],['Convert 11/4 to a mixed number','Divide 11 by 4: quotient 2, remainder 3.','The whole part is 2 and the fraction part is 3/4.','So 11/4 = 2 3/4.'],['Which is an improper fraction?','3/7','9/5','1/2',1,'9/5 has a numerator larger than its denominator.']],

['Dividing fractions',['To divide by a fraction, multiply by its reciprocal (flip it upside down). The reciprocal of 1/2 is 2/1.','Why? Dividing 1 by 1/2 asks how many halves fit in 1, and the answer is 2.'],['Divide 3/4 ÷ 1/2','Flip 1/2 to get 2/1.','Multiply: 3/4 × 2 = 6/4.','Simplify: 6/4 = 3/2 = 1 1/2.'],['1/2 ÷ 1/4 = ?','1/8','2','1/2',1,'Two quarters fit in a half: 1/2 × 4 = 2.']]],

// Dynamic Mathematics Question Translation System (Telugu & Hindi)
function translateMathQuestion(enText, lang) {
  if (!enText || !lang || lang === 0) return enText;
  var txt = String(enText).trim();

  // Telugu (lang === 1)
  if (lang === 1) {
    if (/^Which of the following fractions is in its simplest/i.test(txt)) {
      return 'కింది వాటిలో ఏ భిన్నం అత్యంత సూక్ష్మ రూపంలో (simplest form) ఉంది?';
    }
    if (/^Which fraction is equivalent to (.*)\?/i.test(txt)) {
      var m = txt.match(/^Which fraction is equivalent to (.*)\?/i);
      return m[1] + ' కు సమానమైన భిన్నం ఏది?';
    }
    if (/^Which is (larger|greater): (.*) or (.*)\?/i.test(txt)) {
      var m = txt.match(/^Which is (larger|greater): (.*) or (.*)\?/i);
      return 'ఏది పెద్దది: ' + m[2] + ' లేదా ' + m[3] + '?';
    }
    if (/^Solve for ([a-z]): (.*)/i.test(txt)) {
      var m = txt.match(/^Solve for ([a-z]): (.*)/i);
      return m[1] + ' కొరకు సాధించండి: ' + m[2];
    }
    if (/^Solve: (.*)/i.test(txt)) {
      return 'సాధించండి: ' + txt.replace(/^Solve:\s*/i, '');
    }
    if (/^Calculate: (.*)/i.test(txt)) {
      return 'లెక్కించండి: ' + txt.replace(/^Calculate:\s*/i, '');
    }
    if (/^Evaluate: (.*)/i.test(txt)) {
      return 'విలువను కనుగొనండి: ' + txt.replace(/^Evaluate:\s*/i, '');
    }
    if (/^Simplify: (.*)/i.test(txt)) {
      return 'సూక్ష్మీకరించండి: ' + txt.replace(/^Simplify:\s*/i, '');
    }
    if (/^What are the roots of (.*)\?/i.test(txt)) {
      var m = txt.match(/^What are the roots of (.*)\?/i);
      return m[1] + ' యొక్క మూలాలు ఏమిటి?';
    }
    if (/^Factorize: (.*)/i.test(txt)) {
      return 'కారణాంకాలుగా విభజించండి: ' + txt.replace(/^Factorize:\s*/i, '');
    }
    if (/^What is the value of (.*)\?/i.test(txt)) {
      var m = txt.match(/^What is the value of (.*)\?/i);
      return m[1] + ' యొక్క విలువ ఎంత?';
    }
    if (/^Find the value of (.*)/i.test(txt)) {
      return txt.replace(/^Find the value of\s*/i, '').replace(/\?$/, '') + ' విలువ ఎంత?';
    }
    if (/^What is (.*)\?/i.test(txt)) {
      return txt.replace(/^What is\s*/i, '').replace(/\?$/, '') + ' విలువ ఎంత?';
    }
    if (/=\s*\?/.test(txt)) {
      return txt.replace(/=\s*\?/, '= ? (విలువ ఎంత?)');
    }
    return 'ప్రశ్న: ' + txt;
  }

  // Hindi (lang === 2)
  if (lang === 2) {
    if (/^Which of the following fractions is in its simplest/i.test(txt)) {
      return 'निम्नलिखित में से कौन-सा भिन्न अपने सरलतम रूप में है?';
    }
    if (/^Which fraction is equivalent to (.*)\?/i.test(txt)) {
      var m = txt.match(/^Which fraction is equivalent to (.*)\?/i);
      return m[1] + ' के समतुल्य कौन-सा भिन्न है?';
    }
    if (/^Which is (larger|greater): (.*) or (.*)\?/i.test(txt)) {
      var m = txt.match(/^Which is (larger|greater): (.*) or (.*)\?/i);
      return 'कौन-सा बड़ा है: ' + m[2] + ' या ' + m[3] + '?';
    }
    if (/^Solve for ([a-z]): (.*)/i.test(txt)) {
      var m = txt.match(/^Solve for ([a-z]): (.*)/i);
      return m[1] + ' के लिए हल करें: ' + m[2];
    }
    if (/^Solve: (.*)/i.test(txt)) {
      return 'हल करें: ' + txt.replace(/^Solve:\s*/i, '');
    }
    if (/^Calculate: (.*)/i.test(txt)) {
      return 'गणना करें: ' + txt.replace(/^Calculate:\s*/i, '');
    }
    if (/^Evaluate: (.*)/i.test(txt)) {
      return 'मान ज्ञात कीजिए: ' + txt.replace(/^Evaluate:\s*/i, '');
    }
    if (/^Simplify: (.*)/i.test(txt)) {
      return 'सरल करें: ' + txt.replace(/^Simplify:\s*/i, '');
    }
    if (/^What are the roots of (.*)\?/i.test(txt)) {
      var m = txt.match(/^What are the roots of (.*)\?/i);
      return m[1] + ' के मूल क्या हैं?';
    }
    if (/^Factorize: (.*)/i.test(txt)) {
      return 'गुणनखंड करें: ' + txt.replace(/^Factorize:\s*/i, '');
    }
    if (/^What is the value of (.*)\?/i.test(txt)) {
      var m = txt.match(/^What is the value of (.*)\?/i);
      return m[1] + ' का मान क्या है?';
    }
    if (/^Find the value of (.*)/i.test(txt)) {
      return txt.replace(/^Find the value of\s*/i, '').replace(/\?$/, '') + ' का मान ज्ञात कीजिए';
    }
    if (/^What is (.*)\?/i.test(txt)) {
      return txt.replace(/^What is\s*/i, '').replace(/\?$/, '') + ' क्या है?';
    }
    if (/=\s*\?/.test(txt)) {
      return txt.replace(/=\s*\?/, '= ? (मान क्या है?)');
    }
    return 'प्रश्न: ' + txt;
  }

  return enText;
}

function applyQuestionTranslation(q, lang){
  if(!q || !q.t) return;
  if(lang === 0) return;
  if(!q.t[lang] || q.t[lang] === q.t[0]){
    q.t[lang] = translateMathQuestion(q.t[0], lang);
  }
}

function ans(st,qid,oi,cf,hu){
  var q=QS.filter(function(x){return x.id==qid})[0];
  if(!q)return {ok:false,tag:null,q:{s:"frac"}};
  var ok=oi==q.a,tag=q.o[oi]&&q.o[oi][1];
  st.m[q.s]=cl(st.m[q.s]+(ok?[.1,.18,.25][cf]*(hu?.5:1):[-.1,-.2,-.3][cf]));
  if(!ok&&tag){
    var r=(MC[tag]&&MC[tag].r)||q.s;
    if(r&&r!=q.s)st.m[r]=cl(st.m[r]-.15);
  }
  st.log.push({q:qid,o:oi,ok:ok,cf:cf,tag:tag,h:hu||0,at:now()});
  rvSet(st,qid,ok,cf,hu);
  
  var gained=ok?(cf==2&&!hu?15:10):2;
  st.xp=(st.xp||0)+gained;
  st.n=(st.n||0)+1;
  if(ok)st.c=(st.c||0)+1;
  if(ok&&cf==2)st.sc=(st.sc||0)+1;
  st.ts=Date.now();
  
  // Update passport milestones (Feature 8 & 15)
  st.passport=st.passport||{milestones:["Enrolled in RootGap"],stamps:[]};
  if(st.c==1&&st.passport.milestones.indexOf("First Question Solved")<0){
    st.passport.milestones.push("First Question Solved");
  }
  if(st.m[q.s]>=.8&&st.passport.stamps.indexOf(SK[q.s].n[0])<0){
    st.passport.stamps.push(SK[q.s].n[0]);
    st.passport.milestones.push("Mastered "+SK[q.s].n[0]);
  }
  
  // Daily Mission checks (Feature 17)
  checkMissions(st,ok,cf);
  
  if(!isOnline)pushOfflineQueue({type:"ans",sid:st.id,qid:qid,ok:ok});
  return {ok:ok,tag:tag,q:q};
}

function checkMissions(st,ok,cf){
  var today=new Date(now()).toDateString();
  st.missions=st.missions||{date:today,m1:false,m2:false,m3:false,claimed:false};
  if(st.missions.date!==today){
    st.missions={date:today,m1:false,m2:false,m3:false,claimed:false};
  }
  if((st.n||0)>=5)st.missions.m1=true;
  if(ok&&cf==2)st.missions.m2=true;
}

// Spaced Repetition Scheduling (Feature 12)
function rvSet(st,q,ok,cf,hu){
  st.rv=st.rv||{};
  var o=st.rv[q],d,why;
  if(!ok){d=1;why="wrong"}
  else if(cf==0||hu){d=2;why="fragile"}
  else if(cf==1){d=4;why="review"}
  else{d=Math.min(30,o&&o.why=="review"?o.d*2:7);why="review"}
  st.rv[q]={due:now()+d*864e5,d:d,why:why};
}
function dueList(st){
  var tt=now();
  return Object.keys(st.rv||{}).filter(function(q){
    return st.rv[q].due<=tt&&QS.some(function(x){return x.id==q});
  }).sort(function(a,b){return st.rv[a].due-st.rv[b].due});
}

  if(m=="worksheet"){S.mode="worksheet";S.selectedWsId=k;S.wsAnswers={};S.wsSubmitted=false;R();return}

  S.mode=m;S.sk=k||CLS[S.st.cls];S.done=[];S.streak=0;S.br=null;S.bn=0;S.path=[];S.res=[];S.pr=[];
  S.dl=Math.max(1,Math.min(3,1+(S.st.cls-(SK[k]?SK[k].c:S.st.cls))));
  S.dlog=[];S.rt=null;S.fast=0;S.skip=false;S.end=false;S.fb=null;S.pick=null;S.lesson=null;
  nextQ();R();
}

function nextQ(){
  S.fb=null;S.pick=null;S.lesson=null;S.hu=0;
  var sk=S.br||S.sk;
  var studentCls=S.st?S.st.cls:6;
  var pool;
  if(S.mode=="revise"){
    pool=QS.filter(function(q){return S.rq.indexOf(q.id)>=0&&S.done.indexOf(q.id)<0});
    if(!pool.length){S.end=true;S.cur=null;return}
  }else{
    // Filter questions matching target chapter or active class curriculum
    pool=QS.filter(function(q){
      if(S.done.indexOf(q.id)>=0)return false;
      if(S.targetChapter && (q.chapter === S.targetChapter || q.topic === S.targetChapter)) return true;
      if(S.br)return q.s==sk;
      var qClass=q.cls||(SK[q.s]?SK[q.s].c:null);
      if(qClass){
        if(studentCls==10&&(qClass==9||qClass==10))return q.s==sk;
        if(qClass!==studentCls)return false;
      }
      return q.s==sk;
    });
    // Fallback 1: Any un-attempted question in this skill
    if(!pool.length){
      pool=QS.filter(function(q){return q.s==sk&&S.done.indexOf(q.id)<0});
    }
    // Fallback 2: Any un-attempted question for student's class
    if(!pool.length){
      pool=QS.filter(function(q){
        var qClass=q.cls||(SK[q.s]?SK[q.s].c:null);
        return qClass==studentCls && S.done.indexOf(q.id)<0;
      });
    }
    // Fallback 3: Any un-attempted question across the entire bank
    if(!pool.length){
      pool=QS.filter(function(q){return S.done.indexOf(q.id)<0});
    }
    // Fallback 4: Recycle questions excluding current question so session NEVER freezes midway before 6 questions
    if(!pool.length){
      pool=QS.filter(function(q){return !S.cur || q.id !== S.cur.id});
    }
  }

  // End only if truly no questions exist at all in system
  if(!pool.length){
    S.end=true;S.cur=null;
  }else{
    var dl=S.dl||1;
    if(S.mode=="revise")pool.sort(function(a,b){return S.rq.indexOf(a.id)-S.rq.indexOf(b.id)});
    else pool.sort(function(a,b){return Math.abs((a.d||2)-dl)-Math.abs((b.d||2)-dl)||a.id-b.id});
    S.cur=pool[0];
    if(S.mode=="revise")S.sk=S.cur.s;
    if(S.cur && typeof applyQuestionTranslation === 'function'){
      applyQuestionTranslation(S.cur, L);
    }
  }
}

function pick(i){if(!S.fb){S.pick=i;R()}}

function conf(c){
  if(!S || !S.cur || S.pick === null) return;
  if(S.mode=="test"||S.mode=="battle")return tconf(c);
  if(S.rt)return rtconf(c);
  var q=S.cur,r=ans(S.st,q.id,S.pick,c,S.hu),msg="";
  save();
  (S.done=S.done||[]).push(q.id);
  (S.path=S.path||[]).push({k:q.s,ok:r.ok,c:c,b:!!S.br});
  // Track genuine practice results in S.res
  S.res=S.res||[];
  S.res.push({k:q.s,ok:r.ok,c:c,tag:r.tag,q:q.id});
  S.dl=Math.max(1,Math.min(3,(S.dl||1)+(r.ok&&c==2?1:(!r.ok?-1:0))));
  if(r.ok){
    S.streak=c==2?S.streak+1:0;
    if(S.br){
      S.bn++;
      if(S.bn>=2){S.br=null;S.bn=0;S.streak=0;msg="back"}
    }
  }else{
    S.streak=0;
    var rt=MC[r.tag]&&MC[r.tag].r;
    if(rt){
      S.lesson=rt;
      if(rt!=S.sk&&!S.br&&S.mode=="solve"){S.br=rt;S.bn=0;S.dl=1}
    }
  }
  // Celebrate 3 sure streak without aborting practice session
  if(S.streak>=3&&!S.br&&S.mode=="solve"){
    toast("⭐ Level Up! 3 Sure & Correct in a row!");
  }
  S.fb={ok:r.ok,tag:r.tag,c:c,msg:msg,ask:!r.ok&&L==0&&q.t.length>1&&S.mode=="solve",why:why(r,c)};
  xpFx(r,c);
  R();
}

function nxt(){
  stopAllAudio();
  if(S && S.prevL !== undefined){
    L = S.prevL;
    delete S.prevL;
  }
  if(S.skip || ((S.mode=="solve"||S.mode=="battle") && S.res && S.res.length >= 6)){
    S.end=true;
    S.cur=null;
  }else{
    nextQ();
  }
  R();
}

function why(r,c){
  var cn=["unsure","okay","sure"][c],o=[],q=r.q,rv=S.st.rv&&S.st.rv[q.id],bd=S.mode=="solve"&&!S.br&&S.sk&&q.s!=S.sk;
  if(r.ok){
    o.push("✅ Correct and "+cn+(S.hu?" with "+S.hu+" hint"+(S.hu>1?"s":"")+" (half credit)":"")+".");
    if(bd)o.push("Bridge completed! Back to <b>"+SK[S.sk].n[0]+"</b>, starting at level 1 with fixed foundation.");
    else if(c==0||S.hu)o.push("Marked <b>fragile</b> (low confidence/hints): scheduled for revision in 2 days.");
    else if(c==2)o.push("Level up! Sure streak: "+Math.min(S.streak,3)+" of 3"+(S.streak>=3?" → 🚀 Skip ahead unlocked!":""));
  }else{
    var rt=MC[r.tag]&&MC[r.tag].r;
    o.push("❌ Wrong and "+cn+". Mistake pattern: <b>"+(MC[r.tag]?MC[r.tag].n:"Concept gap")+"</b>.");
    if(rt&&rt!=q.s)o.push("Root gap detected in earlier topic: <b>"+SK[rt].n[0]+"</b>. Launching bridge lesson & 2 check questions.");
    else o.push("Root gap is in this topic. Review the corrective lesson below.");
  }
  return o;
}

function tconf(c){
  if(!S || !S.cur || S.pick === null) return;
  var q=S.cur,r=ans(S.st,q.id,S.pick,c);
  S.dl=Math.max(1,Math.min(3,(S.dl||1)+(r.ok&&c==2?1:(!r.ok?-1:0))));
  (S.done=S.done||[]).push(q.id);
  (S.path=S.path||[]).push({k:q.s,ok:r.ok,c:c,b:!!S.br});
  (S.res=S.res||[]).push({k:q.s,ok:r.ok,c:c,tag:r.tag,q:q.id});
  if(r.ok){
    toast("💥 Hit! -" + (c==2?25:20) + "% Boss HP!");
  }else{
    toast("🛡️ Boss blocked your attack!");
  }
  save();
  if(S.br){S.br=null}
  else if(!r.ok){
    var rt=(MC[r.tag]&&MC[r.tag].r)||q.s;
    if(rt&&rt!=S.sk&&S.pr.indexOf(rt)<0){S.pr.push(rt);S.br=rt}
  }
  (S.dlog=S.dlog||[]).push(twhy(r,c));
  // Complete the full intended 6 diagnostic questions in battle session
  if(S.res.length>=6){
    S.end=true;
    S.cur=null;
    var okCount=S.res.filter(function(x){return x.ok}).length;
    if(okCount>=4){
      S.st.boss=(S.st.boss||0)+1;
      S.st.xp=(S.st.xp||0)+30;
      boom();
      toast("🏆 Gap Monster Defeated! +30 XP");
    }else{
      toast("⚔️ Battle completed! 4+ correct hits needed to defeat the monster.");
    }
    save();
  }else{
    nextQ();
  }
  R();
}

function xpFx(r,c){
  var st=S.st,g=r.ok?(c==2&&!S.hu?15:10):2;
  toast("+"+g+" XP");
  st.ms=Math.max(st.ms||0,S.streak||0);
  if(r.ok&&c==2&&S.streak>=3)boom();
}

function avOf(s){
  var AV=["🦊","🐼","🐯","🐸","🦉","🐙","🦄","🐢"];
  if(s.av)return s.av;
  var h=0;for(var i=0;i<s.name.length;i++)h+=s.name.charCodeAt(i);
  return AV[h%AV.length];
}

    if(sc.hint){
      h+='<div style="margin:8px 0">';
      if(S.rlShowHint){
        h+='<div style="background:rgba(245,158,11,0.12);border-left:3px solid var(--warn);padding:10px;border-radius:6px;font-size:13px;margin-bottom:8px">💡 <b>Practical Hint:</b> '+sc.hint+'</div>';
      }else{
        h+='<button class="btn" style="font-size:12px;padding:4px 10px" onclick="S.rlShowHint=true;R()">💡 Need a Hint?</button>';

      h+='</div>';
    }

    // Answer options
    sc.options.forEach(function(opt,idx){

    if(S.rlPick!=null){
      var isOk=S.rlPick===sc.correctIndex;
      h+='<div class="card" style="margin-top:14px;border-left:4px solid '+(isOk?'var(--ok)':'var(--bad)')+';background:'+(isOk?'var(--ok-soft)':'var(--bad-soft)')+'">';
      h+='<h4 style="margin:0 0 6px 0">'+(isOk?'🎉 Excellent Solution! (+20 XP)':'💡 Almost there! Review the concept:')+'</h4>';

      if(currentIdx>0){
        h+='<button class="btn" onclick="navRl(-1)">← Previous</button>';
      }else{
        h+='<div></div>';

      if(currentIdx<scenariosForClass.length-1){
        h+='<button class="btn p" onclick="navRl(1)">Next Scenario →</button>';
      }else{
        h+='<button class="btn p" onclick="setRlActiveNull()">Browse All Class '+S.rlClass+' Scenarios</button>';
      }
      h+='</div>';
    }

    h+='</div>';
    return h+'</div>';
  }

  // Otherwise, show the Scenario Explorer / Library View
  h+='<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px">';

    if(S.rlCat==="all")return true;

  });

  if(!filteredScenarios.length){
    h+='<div class="card" style="text-align:center;padding:24px"><p class="mut">No scenarios found for this category in Class '+S.rlClass+'.</p>';
    h+='<button class="btn" onclick="setRlCatIdx(0)">View All Class '+S.rlClass+' Scenarios</button></div>';
  }else{
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';
    filteredScenarios.forEach(function(sc){
      var scIdx=scenariosForClass.indexOf(sc);
      h+='<div class="card" style="border:1px solid var(--card-border);display:flex;flex-direction:column;justify-content:space-between;transition:transform 0.2s">';

      h+='<button class="btn p" style="width:100%;font-size:13px;padding:8px" onclick="setRlIdx('+scIdx+')">Solve Practical Challenge →</button>';

    });
    h+='</div>';

  return h+'</div>';

function pickRealLifeScenario(i){
  if(S.rlPick!=null)return;
  S.rlPick=i;
  var scenarios=(typeof REAL_LIFE_SCENARIOS!=="undefined"&&REAL_LIFE_SCENARIOS[S.rlClass])?REAL_LIFE_SCENARIOS[S.rlClass]:[];
  var sc=scenarios.find(function(x){return x.id===S.rlActiveId});
  if(sc&&i===sc.correctIndex){
    if(S.st)S.st.xp=(S.st.xp||0)+20;
    save();
    toast("+20 XP! Real-life scenario solved!");
    boom();
  }
  R();
}

function setSqClass(c){
  S.sqClass=c;S.sqActiveId=null;S.sqPick=null;S.sqShowHint=false;S.sqDone=false;R();
}
function setSqActiveNull(){
  S.sqActiveId=null;S.sqPick=null;S.sqShowHint=false;S.sqDone=false;R();
}
function setSqIdx(idx){
  var list=(typeof STORY_QUESTS!=="undefined"&&STORY_QUESTS[S.sqClass])?STORY_QUESTS[S.sqClass]:[];
  if(idx>=0&&idx<list.length){
    S.sqActiveId=list[idx].id;
    S.sqStage=0;
    S.sqScore=0;
    S.sqPick=null;
    S.sqShowHint=false;

      h+='<h4 style="margin:0 0 6px 0">'+(isOk?'✨ Success! Chapter Unlocked (+15 XP)':'⚠️ The Challenge Resists:')+'</h4>';

function pickStoryStage(i){
  if(S.sqPick!=null)return;
  S.sqPick=i;
  var quests=(typeof STORY_QUESTS!=="undefined"&&STORY_QUESTS[S.sqClass])?STORY_QUESTS[S.sqClass]:[];
  var q=quests.find(function(x){return x.id===S.sqActiveId});
  if(q){
    var stage=q.stages[S.sqStage||0];
    if(stage&&i===stage.correctIndex){
      S.sqScore=(S.sqScore||0)+1;

      toast("+15 XP! Chapter checkpoint cleared!");
      boom();

function completeStoryQuest(){

  if(S.st)S.st.xp=(S.st.xp||0)+50;
  save();
  toast("🏆 +50 XP! Epic Quest Complete!");

}

function rPeers(){
  var pd=DB.peerDiscussions||[];
  var h='<div class="card"><div class="row" style="justify-content:space-between"><div><span class="tag">👥 Feature 13: Peer Learning Rooms</span><h3>Collaborative Learning Hub</h3></div><button class="btn" onclick="S.mode=null;R()">← Back</button></div>';
  h+='<p class="mut">Ask questions, share explanations, and learn from classmates with peer-to-peer mentoring.</p>';

  h+='<div class="card"><h4>Ask your classmates a question</h4><textarea id="peer_txt" rows="2" placeholder="e.g. Can someone explain why (-3) × (-4) is positive?" style="width:100%;padding:8px"></textarea><button class="btn p" style="margin-top:6px" onclick="postPeerQuestion()">Post Question</button></div>';

  h+='<div class="card"><h4>Active Classroom Discussions ('+pd.length+')</h4>';
  pd.forEach(function(d){
    h+='<div style="border-bottom:1px solid var(--ln);padding:10px 0">';
    h+='<b>'+d.author+'</b> <span class="tag">Topic: '+d.topic+'</span><p style="margin:4px 0">'+d.text+'</p>';
    if(d.replies&&d.replies.length){
      h+='<div style="margin-left:16px;background:var(--soft);padding:8px 12px;border-radius:8px">';
      d.replies.forEach(function(rep){
        h+='<div><b>'+rep.author+':</b> '+rep.text+'</div>';
      });
      h+='</div>';
    }
    h+='<div class="row" style="margin-top:6px"><input id="rep_'+d.id+'" placeholder="Write a supportive reply..." style="flex:1;padding:4px 8px"><button class="btn sm" onclick="replyPeer('+d.id+')">Reply</button></div>';
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}
function postPeerQuestion(){
  var val=document.getElementById("peer_txt").value.trim();
  if(!val)return;
  DB.peerDiscussions=DB.peerDiscussions||[];
  DB.peerDiscussions.unshift({id:Date.now(),author:S.st.name,topic:S.sk,text:val,replies:[]});
  save();toast("Question posted to classroom!");R();
}
function replyPeer(id){
  var el=document.getElementById("rep_"+id);
  if(!el||!el.value.trim())return;
  var d=DB.peerDiscussions.find(function(x){return x.id==id});
  if(d){
    d.replies=d.replies||[];
    d.replies.push({author:S.st.name,text:el.value.trim()});
    save();toast("Reply sent!");R();
  }
}

var elevenLabsConnectPromise = null;
var activeElevenLabsConv = null;
var elevenLabsStatus = "idle";
var elevenLabsMode = "listening";
var elevenLabsErrorMsg = "";
var pendingUserText = null;
var micUserEnabled = false;

function scrollChatToBottom(){
  setTimeout(function(){
    var el = document.getElementById("chat_scroll");
    if(el) el.scrollTop = el.scrollHeight;
  }, 30);
}

function updateRootyStatusUI(){
  var badge = document.getElementById("rooty_status_badge");
  var micBtn = document.getElementById("rooty_mic_btn");
  var typingInd = document.getElementById("rooty_typing_ind");

  if(badge){
    if(elevenLabsStatus === "connected"){
      if(elevenLabsMode === "speaking"){
        badge.className = "pill g";
        badge.innerHTML = "🔊 Speaking";
      } else {
        badge.className = "pill g";
        badge.innerHTML = micUserEnabled ? "🎙️ Listening" : "🟢 Connected";
      }
    } else if(elevenLabsStatus === "connecting"){
      badge.className = "pill l";
      badge.innerHTML = "🟡 Connecting...";
    } else if(elevenLabsStatus === "error"){
      badge.className = "pill c";
      badge.innerHTML = "⚠️ Error";
    } else {
      badge.className = "pill";
      badge.innerHTML = "⚡ Ready";
    }
  }

  if(micBtn){
    if(elevenLabsStatus === "connected"){
      if(elevenLabsMode === "speaking"){
        micBtn.innerHTML = "🔊 Speaking";
        micBtn.className = "btn sm";
        micBtn.style.borderColor = "var(--ok)";
      } else if(micUserEnabled){
        micBtn.innerHTML = "🎙️ Mic On";
        micBtn.className = "btn sm p";
        micBtn.style.borderColor = "var(--pri)";
      } else {
        micBtn.innerHTML = "🔇 Mic Off";
        micBtn.className = "btn sm";
        micBtn.style.borderColor = "var(--ln)";
      }
    } else {
      micBtn.innerHTML = "🎙️ Mic";
      micBtn.className = "btn sm";
    }
  }

  if(typingInd){
    typingInd.style.display = chatLoading ? "block" : "none";
  }
}

function appendChatMessageUI(sender, text){
  var scrollEl = document.getElementById("chat_scroll");
  if(scrollEl){
    var msgDiv = document.createElement("div");
    msgDiv.className = "msg " + (sender === "user" ? "user" : "bot");
    msgDiv.innerHTML = text.replace(/\n/g, "<br>");
    scrollEl.appendChild(msgDiv);
    scrollChatToBottom();
  }
}

function toggleMic(){

async function connectElevenLabsRooty(initialQuestion){
  if(activeElevenLabsConv && activeElevenLabsConv.isOpen && activeElevenLabsConv.isOpen()){
    if(initialQuestion) sendChat(initialQuestion);
    return activeElevenLabsConv;
  }

  if(elevenLabsConnectPromise){
    if(initialQuestion) pendingUserText = initialQuestion;
    return elevenLabsConnectPromise;
  }

  elevenLabsStatus = "connecting";
  elevenLabsErrorMsg = "";
  updateRootyStatusUI();

  elevenLabsConnectPromise = (async function(){
    try {
      var res = await fetch("/api/elevenlabs/conversation-credentials");
      if(!res.ok){
        var errData = await res.json().catch(function(){ return {}; });
        throw new Error(errData.error || ("Server error (" + res.status + ")"));
      }
      var creds = await res.json();

      if(!window.ElevenLabsClient || !window.ElevenLabsClient.Conversation){
        throw new Error("ElevenLabs SDK is not loaded. Please ensure elevenlabs-client.js is loaded.");
      }

      var options = {
        agentId: creds.agentId || "agent_0101m6bb7qwkemyty7444cwtt0cp",
        connectionType: creds.connectionType || "websocket",
        textOnly: !micUserEnabled,
        onConnect: function(props){
          console.log("ElevenLabs Rooty connected:", props && props.conversationId);
          elevenLabsStatus = "connected";
          elevenLabsErrorMsg = "";

          if(activeElevenLabsConv && typeof activeElevenLabsConv.setMicMuted === "function"){
            activeElevenLabsConv.setMicMuted(!micUserEnabled);
          }

          try{
            var stName = S && S.st ? S.st.name : "Student";
            var stCls = S && S.st ? S.st.cls : 8;
            var topic = S && S.sk && SK[S.sk] ? SK[S.sk].n[0] : "Mathematics";
            activeElevenLabsConv.sendContextualUpdate(
              "The student is exploring ROOT_GAP. Grade: Class " + stCls + ". Current Topic: " + topic + ". Name: " + stName + "."
            );
          }catch(e){}

          if(pendingUserText){
            var q = pendingUserText;
            pendingUserText = null;
            sendChat(q);
          }
          updateRootyStatusUI();
        },
        onDisconnect: function(details){
          console.log("ElevenLabs Rooty disconnected:", details);
          elevenLabsStatus = "disconnected";
          activeElevenLabsConv = null;
          updateRootyStatusUI();
        },
        onMessage: function(payload){
          if(!payload || !payload.message) return;
          var text = payload.message.trim();
          if(!text) return;

          var isUser = (payload.role === "user" || payload.source === "user");
          var sender = isUser ? "user" : "bot";

          var isDuplicate = false;
          if(chatHistory.length > 0){
            var last = chatHistory[chatHistory.length - 1];
            if(last.sender === sender && last.text.trim() === text){
              isDuplicate = true;
            }
          }

          if(!isDuplicate){
            chatLoading = false;
            chatHistory.push({ sender: sender, text: text });
            appendChatMessageUI(sender, text);
            updateRootyStatusUI();
          }
        },
        onError: function(err, context){
          console.error("ElevenLabs error callback:", err, context);
          elevenLabsStatus = "error";
          elevenLabsErrorMsg = typeof err === "string" ? err : (err && err.message ? err.message : "Connection error");
          chatLoading = false;
          updateRootyStatusUI();
        },
        onStatusChange: function(prop){
          if(prop && prop.status) elevenLabsStatus = prop.status;
          updateRootyStatusUI();
        },
        onModeChange: function(prop){
          if(prop && prop.mode){
            elevenLabsMode = prop.mode;
            if(activeElevenLabsConv && typeof activeElevenLabsConv.setMicMuted === "function"){
              if(prop.mode === "speaking"){
                activeElevenLabsConv.setMicMuted(true);
              } else if(prop.mode === "listening" && micUserEnabled && chatOpen){
                setTimeout(function(){
                  if(activeElevenLabsConv && micUserEnabled && chatOpen){
                    activeElevenLabsConv.setMicMuted(false);
                  }
                }, 350);
              }
            }
          }
          updateRootyStatusUI();
        }
      };

      if(creds.signedUrl){
        options.signedUrl = creds.signedUrl;
      } else if(creds.conversationToken){
        options.conversationToken = creds.conversationToken;
      }

      activeElevenLabsConv = await window.ElevenLabsClient.Conversation.startSession(options);
      return activeElevenLabsConv;

    } catch(err){
      console.error("Failed to connect ElevenLabs Rooty:", err);
      elevenLabsStatus = "error";
      elevenLabsErrorMsg = err.message || "Failed to connect to ElevenLabs Conversational AI.";
      chatLoading = false;
      updateRootyStatusUI();
      throw err;
    } finally {
      elevenLabsConnectPromise = null;
    }
  })();

  return elevenLabsConnectPromise;
}

function sendChat(customText){
  var txt = customText;
  if(!txt){
    var inp = document.getElementById("chat_input");
    if(inp){
      txt = inp.value.trim();
      inp.value = "";
    }
  }
  if(!txt) return;

  var isDuplicate = false;
  if(chatHistory.length > 0){
    var last = chatHistory[chatHistory.length - 1];
    if(last.sender === "user" && last.text.trim() === txt.trim()){
      isDuplicate = true;
    }
  }
  if(!isDuplicate){
    chatHistory.push({ sender: "user", text: txt });
    appendChatMessageUI("user", txt);
  }
  chatLoading = true;
  updateRootyStatusUI();

  // 1. If ElevenLabs is actively connected and open, send text directly to Rooty agent
  if(activeElevenLabsConv && activeElevenLabsConv.isOpen && activeElevenLabsConv.isOpen()){
    try {
      activeElevenLabsConv.sendUserMessage(txt);
      // Safety timeout: if agent doesn't respond in 8s, fallback to Gemini tutor
      var prevHistoryLen = chatHistory.length;
      setTimeout(function(){
        if(chatLoading && chatHistory.length === prevHistoryLen){
          console.warn("ElevenLabs agent response timeout, falling back to Gemini tutor...");
          fallbackToGeminiTutor(txt);
        }
      }, 8000);
      return;
    } catch(e) {
      console.warn("sendUserMessage failed, falling back to Gemini:", e);
      fallbackToGeminiTutor(txt);
      return;
    }
  }

  // 2. If connection is in progress, queue text
  if(elevenLabsConnectPromise){
    pendingUserText = txt;
    return;
  }

  // 3. If not yet connected, initiate connection and send message upon connect
  if(elevenLabsStatus !== "connected"){
    pendingUserText = txt;
    connectElevenLabsRooty().then(function(conv){
      if(conv && conv.isOpen && conv.isOpen()){
        conv.sendUserMessage(txt);
      }
    }).catch(function(err){
      console.warn("ElevenLabs connect failed, falling back to Gemini tutor:", err);
      fallbackToGeminiTutor(txt);
    });
    return;
  }

  fallbackToGeminiTutor(txt);
}

function fallbackToGeminiTutor(userText){
  chatLoading = true;
  updateRootyStatusUI();
  var stName = S && S.st ? S.st.name : "Student";
  var stCls = S && S.st ? S.st.cls : 8;
  var topic = S && S.sk && SK[S.sk] ? SK[S.sk].n[0] : "Mathematics";
  var langCode = ["en", "te", "hi"][L] || "en";
  var recentHistory = chatHistory.slice(-4).map(function(m){ return { role: m.sender === "user" ? "user" : "model", text: m.text }; });

  fetch("/api/tutor", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      question: userText,
      studentClass: stCls,
      topic: topic,
      language: langCode,
      history: recentHistory
    })
  }).then(function(res){
    if(!res.ok){
      return res.json().then(function(e){ throw new Error(e.error || ("AI service returned HTTP " + res.status)); });
    }
    return res.json();
  }).then(function(data){
    chatLoading = false;
    var botReply = data.answer || "I reviewed your math question! Let's examine the core concept together.";
    chatHistory.push({ sender: "bot", text: botReply });
    appendChatMessageUI("bot", botReply);
    updateRootyStatusUI();
  }).catch(function(err){
    console.error("Rooty tutor error:", err);
    chatLoading = false;
    var errMsg = "⚠️ Rooty: " + (err.message || "Network issue connecting to AI service. Please try again.");
    chatHistory.push({ sender: "bot", text: errMsg });
    appendChatMessageUI("bot", errMsg);
    updateRootyStatusUI();
  });
}

function rStudentWorksheet(){

  h += '<p class="mut" style="font-size:13px;margin:0 0 14px 0">' + ws.questions.length + ' Questions · Target Practice Assignment</p>';

  if(isSubmitted){

    var total = ws.questions.length;

    h += '<div class="card" style="border:2px solid ' + (passed ? 'var(--ok)' : 'var(--warn)') + ';background:' + (passed ? 'rgba(16,185,129,0.08)' : 'rgba(245,158,11,0.08)') + ';margin-bottom:14px">';
    h += '<h3 style="margin:0 0 4px 0">' + (passed ? '🎉 Great Job!' : '📚 Practice Completed!') + '</h3>';
    h += '<p style="margin:0">You scored <b>' + score + ' / ' + total + '</b> on this worksheet. ' + (passed ? '+15 XP awarded to your profile!' : 'Review the detailed explanations below to strengthen your understanding.') + '</p>';
    h += '</div>';
  }

  ws.questions.forEach(function(q, qIdx){
    h += '<div class="card" style="border:1px solid var(--ln);margin-bottom:12px;padding:12px">';
    h += '<p style="font-weight:700;margin:0 0 8px 0">Q' + (qIdx + 1) + '. ' + q.text + '</p>';
    
    q.options.forEach(function(optText, optIdx){
      var optClass = "opt";
      var isPicked = answers[qIdx] === optIdx;
      if(isSubmitted){
        if(optIdx === q.correctIndex) optClass += " good";
        else if(isPicked && optIdx !== q.correctIndex) optClass += " wrong";
      } else if(isPicked){
        optClass += " sel";
      }
      var clickHandler = isSubmitted ? "" : 'onclick="selectWsOpt(' + qIdx + ',' + optIdx + ')"';
      h += '<button class="' + optClass + '" ' + clickHandler + ' style="cursor:' + (isSubmitted ? 'default' : 'pointer') + '">' + "ABCD"[optIdx] + ". " + optText + '</button>';
    });

      h += '<div class="lesson" style="margin-top:8px"><small><b>Explanation:</b> ' + (q.explanation || ('Correct Answer: Option ' + "ABCD"[q.correctIndex])) + '</small></div>';

    var allAnswered = answeredCount === ws.questions.length;
    h += '<div class="row" style="gap:10px;margin-top:14px">';
    h += '<button class="btn p" onclick="submitWorksheet(\'' + ws.id + '\')">' + (allAnswered ? 'Submit Worksheet (' + answeredCount + '/' + ws.questions.length + ') ✅' : 'Submit Worksheet (' + answeredCount + '/' + ws.questions.length + ' answered)') + '</button>';

    h += '</div>';

    h += '<div class="row" style="gap:10px;margin-top:14px">';
    h += '<button class="btn p" onclick="S.mode=null;R()">Done & Return Home</button>';
    h += '<button class="btn" onclick="retryWorksheet(\'' + ws.id + '\')">🔄 Retake Worksheet</button>';
    h += '</div>';
  }

  h += '</div>';
  return h;

function submitWorksheet(wsId){

function hintBox(){
  var k=S.cur.s,n=S.hu||0,q=S.cur;
  if(!n)return"";
  var hnList=HN[k]||["Think carefully about the operation.","Check your signs or operations."];
  var weList=WE[k]||["Step 1: Simplify","Step 2: Solve"];
  var h1 = (q && q.hint) ? q.hint : (hnList[0] || "Consider the core concept.");
  var h2 = hnList[1] || hnList[0] || "Re-check calculation.";
  var h3 = (q && q.exp) ? q.exp : weList.join(" → ");
  return'<div class="lesson">'+(n>=1?"<p>💡 "+h1+"</p>":"")+(n>=2?"<p>💡 "+h2+"</p>":"")+(n>=3?"<p><b>Worked Example:</b> "+h3+"</p>":"")+'</div>';

function tryLang(i){S.prevL=L;L=i;S.fb=null;S.pick=null;S.rt=1;R()}
function rtconf(c){
  var q=S.cur,ok=S.pick==q.a,st=S.st;
  S.rt=null;
  var langName=L===1?"Telugu":L===2?"Hindi":"Regional";
  var studentPickText=(q.o&&q.o[S.pick])?q.o[S.pick][0]:("Option "+S.pick);
  var correctText=(q.o&&q.o[q.a])?q.o[q.a][0]:"";

  // Find student's previous English attempt for this question in st.log
  var prevAttempt = (st.log||[]).slice().reverse().find(function(l){ return l.q === q.id && !l.ok; });
  var englishPickIndex = prevAttempt ? prevAttempt.o : null;
  var englishPickText = (englishPickIndex !== null && q.o && q.o[englishPickIndex]) ? q.o[englishPickIndex][0] : "Incorrect in English";

  // LANGUAGE GAP LOGIC:
  // Language barrier ONLY identified when student demonstrates conceptual understanding (ok === true in home language)
  // If still wrong in home language, classify as CONCEPTUAL GAP (ok === false)
  (st.lgl=st.lgl||[]).push({
    qId:q.id,
    qEng:q.t[0],
    qLang:q.t[L]||q.t[0],
    lang:langName,
    langCode:L,
    englishPick:englishPickText,
    pick:S.pick,
    pickText:studentPickText,
    correctText:correctText,
    ok:ok,
    type:ok?"barrier":"concept",
    ts:Date.now()
  });
  st.ts=Date.now();
  (S.done=S.done||[]).push(q.id);
  (S.res=S.res||[]).push({k:q.s,ok:ok,c:c,tag:ok?null:"conceptGap",q:q.id});
  (S.path=S.path||[]).push({k:q.s,ok:ok,c:c,b:!!S.br});
  save();
  if(ok){S.br=null;S.bn=0}
  S.fb={
    ok:ok,
    tag:null,
    c:c,
    msg:"",
    lang:ok,
    why:ok
      ? ["🌐 Right in your home language ("+langName+")! The English phrasing was the obstacle, not the mathematics.","No bridge lesson needed. Your teacher sees a language-comprehension flag."]
      : ["Still incorrect in "+langName+". This is a mathematical concept gap, not a language barrier: the foundational lesson is shown below."]
  };
  R();
}

function chkL(i){
  var c=LES[S.lk][S.li][3];
  S.lp=i;
  if(i==c[4]){

  chapters.forEach(function(ch){
    h+='<option value="'+ch+'"'+(ch===activeCh?' selected':'')+'>'+ch+'</option>';
  });
  h+='</select>';
  h+='<button class="btn p" onclick="updateActiveChapter('+cls+')">Update Active Chapter</button>';
  h+='</div></div>';

  // Chapter-wise Student Performance Matrix
  h+='<div class="card"><h4>Chapter-Wise Student Performance Matrix (Class '+cls+')</h4>';
  var studentsInClass = DB.st.filter(function(s){ return s.cls == cls; });

  if(!studentsInClass.length){
    h+='<p class="mut">No students enrolled in Class '+cls+' yet.</p>';
  }else{
    h+='<div class="tbl"><table><tr><th>Chapter Name</th><th>Status</th><th>Questions Solved</th><th>Accuracy</th><th>Active Learners</th></tr>';
    chapters.forEach(function(ch){
      var isCur = (ch === activeCh);
      var totalAttempts = 0, correctAttempts = 0, activeLearners = 0;

      studentsInClass.forEach(function(s){
        var chLogs = (s.log||[]).filter(function(l){
          var q = QS.find(function(x){ return x.id == l.q; });
          return (l.chapter === ch) || (q && q.chapter === ch);
        });
        if(chLogs.length){
          activeLearners++;
          totalAttempts += chLogs.length;
          correctAttempts += chLogs.filter(function(x){ return x.ok; }).length;
        }
      });

      var acc = totalAttempts ? Math.round((correctAttempts / totalAttempts) * 100) + '%' : '–';

      h+='<tr><td><b>'+ch+'</b></td><td>'+statusTag+'</td><td>'+totalAttempts+'</td><td>'+acc+'</td><td>'+activeLearners+' student(s)</td></tr>';
    });
    h+='</table></div>';
  }
  h+='</div></div>';
  return h;
}

        {text:"Evaluate: -10 + 6",options:["-16","-4","4","16"],correctIndex:1,explanation:"Different signs: subtract absolute values and keep sign of greater number: -4."}

    };

  });

  }

  // Student specific metrics
  var logs = s.log || [];
  var totalQuestions = logs.length;
  var correctQuestions = logs.filter(function(l){ return l.ok; }).length;
  var accuracy = totalQuestions ? Math.round((correctQuestions / totalQuestions) * 100) : 0;
  var sureCorrect = logs.filter(function(l){ return l.ok && l.cf === 2; }).length;
  var xp = s.xp || 0;
  var lvl = lvOf(s);
  var bossDefeats = s.boss || 0;

  // Student specific skill analysis
  var relevantSkills = ORD.slice(0, ORD.indexOf(CLS[s.cls]) + 1);
  if(!relevantSkills.length) relevantSkills = ORD;
  var weakK = weakest(s);
  var strongK = relevantSkills.reduce(function(best, k){
    return ((s.m[k] || 0) > (s.m[best] || 0)) ? k : best;
  }, relevantSkills[0]);

  // Child Header Banner
  h+='<div class="card" style="border-left:4px solid var(--pri);background:radial-gradient(ellipse at top left,rgba(124,58,237,0.18),transparent 70%)">';
  h+='<div class="row" style="justify-content:space-between;align-items:center">';
  h+='<div><div class="row" style="align-items:center;gap:10px"><div class="av big">'+avOf(s)+'</div><div><h2 style="margin:0 0 2px 0">'+s.name+'</h2><span class="pill g">Class '+s.cls+' Student</span> · <span class="pill l">Level '+lvl+' Explorer</span></div></div></div>';
  h+='<div style="text-align:right"><h1 style="margin:0;font-size:32px;color:var(--gold)">'+xp+'</h1><small class="mut">Total Learning XP</small></div>';
  h+='</div>';

  // Key KPI grid
  h+='<div class="m4" style="margin:16px 0 8px 0">';
  h+='<div><span class="stat">'+totalQuestions+'</span><br><small class="mut">Questions Solved</small></div>';
  h+='<div><span class="stat" style="color:var(--ok)">'+accuracy+'%</span><br><small class="mut">Overall Accuracy</small></div>';
  h+='<div><span class="stat" style="color:var(--gold)">'+sureCorrect+'</span><br><small class="mut">Mastered (Sure &amp; Correct)</small></div>';
  h+='<div><span class="stat" style="color:var(--accent)">'+bossDefeats+'</span><br><small class="mut">Boss Defeats</small></div>';
  h+='</div>';
  h+='</div>';

  // Topic Mastery Breakdown
  h+='<div class="card"><h4>Topic Mastery Breakdown for '+s.name+'</h4>';
  h+='<div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">';
  relevantSkills.forEach(function(k){
    var m = Math.round((s.m[k] || 0) * 100);
    var color = m >= 75 ? 'var(--ok)' : m >= 50 ? 'var(--gold)' : 'var(--bad)';
    h+='<div><div class="row" style="justify-content:space-between;margin-bottom:3px"><b>'+SK[k].icon+' '+SK[k].n[0]+'</b><span>'+m+'%</span></div>';
    h+='<div class="bar"><i style="width:'+m+'%;background:'+color+'"></i></div></div>';
  });
  h+='</div>';
  h+='<div class="row" style="margin-top:14px;gap:12px;flex-wrap:wrap">';

  h+='<div style="flex:1;min-width:200px;padding:10px;background:rgba(244,63,94,0.08);border-left:3px solid var(--bad);border-radius:6px"><b style="color:var(--bad)">🎯 Focus Area for Home:</b> '+SK[weakK].n[0]+' ('+Math.round((s.m[weakK]||0)*100)+'%)<br><small class="mut">Prerequisite foundation needs reinforcement before exams.</small></div>';
  h+='</div></div>';

  // Recent Quiz and Practice History (Student specific)
  h+='<div class="card"><h4>Recent Practice &amp; Quiz Attempts for '+s.name+' ('+logs.length+')</h4>';
  if(!logs.length){

  }else{
    h+='<div class="tbl"><table><tr><th>Question</th><th>Result</th><th>Confidence</th><th>Date</th></tr>';
    logs.slice(-6).reverse().forEach(function(l){
      var q = QS.find(function(x){ return x.id == l.q; });
      var qText = q ? q.t[0] : ("Question #" + l.q);

  h+='</div>';

  return h+'</div>';
}

// Interactive helper for Section 3 Concept Map Simulator
function simulateLandingFix(key){
  var nodes=["node-frac","node-neg","node-lin","node-quad"];
  nodes.forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.classList.remove("active","fixed");
  });
  var target=document.getElementById("node-"+key);
  if(target)target.classList.add("active");

  var titleEl=document.getElementById("rg-sim-title");
  var descEl=document.getElementById("rg-sim-desc");
  if(!titleEl || !descEl)return;

  if(key=="frac"){
    titleEl.textContent="Class 6: Fractions (Foundational Root)";
    descEl.textContent="Student thinks a bigger denominator means a bigger fraction (e.g., 1/3 > 1/2). ROOT_GAP activates a visual pizza/number line slice model, resolving the gap in under 2 minutes.";
  } else if(key=="neg"){
    titleEl.textContent="Class 7: Negative Numbers (Prerequisite Bridge)";
    descEl.textContent="Student drops negative signs during subtraction or assumes (−) × (−) = (−). ROOT_GAP anchors number line direction and opposite cancellation, securing the bridge.";
  } else if(key=="lin"){
    titleEl.textContent="Class 8: Linear Equations (Algebraic Transposition)";
    descEl.textContent="Student moves terms across '=' without flipping sign (e.g. x + 5 = 2 -> x = 7). ROOT_GAP proves the balance scale principle: subtracting 5 from BOTH sides leaves x = −3.";
  } else if(key=="quad"){
    titleEl.textContent="Class 9–10: Quadratic Equations (Advanced Mastery)";
    descEl.textContent="Student solves x² = 16 and only writes x = 4, forgetting the negative root x = −4. With foundational sign rules mastered, dual roots (±4) become intuitive and permanent.";
  }
}

// THREE.JS 3D INITIALIZATION & RESOURCE MANAGEMENT
// ==========================================
var landing3DAnimId = null;
var heroScene = null, heroRenderer = null, heroMesh = null, heroParticles = null;
var orbScene = null, orbRenderer = null, orbCore = null, orbWire = null, orbRings = [];
var mouseX = 0, mouseY = 0;

function initLanding3D(){
  if(view !== "landing") return;
  if(typeof THREE === "undefined"){
    console.warn("Three.js not loaded yet; visual fallback active.");
    return;
  }

  // Cancel prior animation loop if any
  if(landing3DAnimId){
    cancelAnimationFrame(landing3DAnimId);
    landing3DAnimId = null;
  }

  try {
    initHero3D();
    initOrb3D();
    start3DLoop();
  } catch(e) {
    console.warn("3D initialization caught gracefully:", e);
  }
}

function initHero3D(){
  var canvas = document.getElementById("rg-hero-canvas");
  if(!canvas) return;
  var container = document.getElementById("rg-hero-canvas-wrap");
  var width = container ? container.clientWidth : 800;
  var height = container ? container.clientHeight : 500;

  heroScene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.z = 24;

  heroRenderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  heroRenderer.setSize(width, height);
  heroRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Central Mathematical Concept Lattice (Icosahedron & Octahedron in wireframe)
  var geomIco = new THREE.IcosahedronGeometry(6.5, 1);
  var matIco = new THREE.MeshBasicMaterial({
    color: 0x8b5cf6,
    wireframe: true,
    transparent: true,
    opacity: 0.35
  });
  heroMesh = new THREE.Mesh(geomIco, matIco);
  heroScene.add(heroMesh);

  // Inner Octahedron core (Neon Magenta)
  var geomOct = new THREE.OctahedronGeometry(3.8, 0);
  var matOct = new THREE.MeshBasicMaterial({
    color: 0xec4899,
    wireframe: true,
    transparent: true,
    opacity: 0.55
  });
  var innerMesh = new THREE.Mesh(geomOct, matOct);
  heroMesh.add(innerMesh);

  // Floating ambient mathematical particle cloud
  var particleCount = 180;
  var partGeom = new THREE.BufferGeometry();
  var posArray = new Float32Array(particleCount * 3);
  for(var i = 0; i < particleCount * 3; i += 3){
    posArray[i] = (Math.random() - 0.5) * 36;
    posArray[i+1] = (Math.random() - 0.5) * 28;
    posArray[i+2] = (Math.random() - 0.5) * 20;
  }
  partGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  var partMat = new THREE.PointsMaterial({
    size: 0.35,
    color: 0xc084fc,
    transparent: true,
    opacity: 0.7
  });
  heroParticles = new THREE.Points(partGeom, partMat);
  heroScene.add(heroParticles);

  // Mouse Parallax Listener
  window.addEventListener("mousemove", function(e){
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  // Handle Resize
  window.addEventListener("resize", function(){
    if(view !== "landing" || !canvas || !container) return;
    var w = container.clientWidth;
    var h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    heroRenderer.setSize(w, h);
  });

  heroScene.userData = { camera: camera };
}

function initOrb3D(){
  var canvas = document.getElementById("rg-orb-canvas");
  if(!canvas) return;
  var container = canvas.parentElement;
  var width = container ? container.clientWidth : 340;
  var height = container ? container.clientHeight : 340;

  orbScene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.z = 15;

  orbRenderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  orbRenderer.setSize(width, height);
  orbRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Glowing Spherical Neural Core
  var coreGeom = new THREE.SphereGeometry(3.2, 24, 24);
  var coreMat = new THREE.MeshBasicMaterial({
    color: 0x7c3aed,
    wireframe: true,
    transparent: true,
    opacity: 0.4
  });
  orbCore = new THREE.Mesh(coreGeom, coreMat);
  orbScene.add(orbCore);

  // Outer wireframe shell
  var shellGeom = new THREE.IcosahedronGeometry(4.2, 2);
  var shellMat = new THREE.MeshBasicMaterial({
    color: 0xec4899,
    wireframe: true,
    transparent: true,
    opacity: 0.35
  });
  orbWire = new THREE.Mesh(shellGeom, shellMat);
  orbScene.add(orbWire);

  // Multi-Axis Orbital Rings
  orbRings = [];
  var ringColors = [0xa855f7, 0xec4899, 0x6366f1];
  for(var r = 0; r < 3; r++){
    var ringGeom = new THREE.TorusGeometry(4.8 + r * 0.4, 0.05, 12, 64);
    var ringMat = new THREE.MeshBasicMaterial({
      color: ringColors[r],
      transparent: true,
      opacity: 0.65
    });
    var ringMesh = new THREE.Mesh(ringGeom, ringMat);
    ringMesh.rotation.x = Math.PI * (0.2 + r * 0.3);
    ringMesh.rotation.y = Math.PI * (0.15 + r * 0.25);
    orbScene.add(ringMesh);
    orbRings.push(ringMesh);
  }

  orbScene.userData = { camera: camera };
}

function start3DLoop(){
  function animate(timestamp){
    if(view !== "landing"){
      landing3DAnimId = null;
      return;
    }

    // Hero 3D Rotation & Parallax
    if(heroMesh && heroRenderer && heroScene){
      heroMesh.rotation.y += 0.0035;
      heroMesh.rotation.x += 0.002;
      if(heroParticles){
        heroParticles.rotation.y -= 0.001;
      }
      var heroCam = heroScene.userData.camera;
      if(heroCam){
        heroCam.position.x += (mouseX * 2.5 - heroCam.position.x) * 0.04;
        heroCam.position.y += (mouseY * 2.0 - heroCam.position.y) * 0.04;
        heroCam.lookAt(0, 0, 0);
        heroRenderer.render(heroScene, heroCam);
      }
    }

    // AI Rooty Orb 3D Dynamics
    if(orbCore && orbRenderer && orbScene){
      var pulse = Math.sin(timestamp * 0.0025) * 0.08;
      orbCore.scale.set(1 + pulse, 1 + pulse, 1 + pulse);
      orbCore.rotation.y += 0.008;
      if(orbWire){
        orbWire.rotation.y -= 0.006;
        orbWire.rotation.x += 0.004;
      }
      orbRings.forEach(function(ring, idx){
        ring.rotation.z += 0.007 * (idx % 2 === 0 ? 1 : -1);
      });
      var orbCam = orbScene.userData.camera;
      if(orbCam){
        orbRenderer.render(orbScene, orbCam);
      }
    }

    landing3DAnimId = requestAnimationFrame(animate);
  }
  landing3DAnimId = requestAnimationFrame(animate);
}
